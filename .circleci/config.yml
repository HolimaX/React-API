# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

orbs:
  node: circleci/node@6.1.0

jobs:
  test:
    docker:
      - image: cimg/node:22.9.0-browsers
    steps:
      - run:
          name: Checkout code
          command: |
            REPO_URL="https://github.com/HolimaX/React-API.git"
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              REPO_URL="https://${GITHUB_TOKEN}@github.com/HolimaX/React-API.git"
            fi
            git clone "$REPO_URL" .
            git checkout "$CIRCLE_SHA1"
      - node/install-packages:
          pkg-manager: npm
      #- run:
      #    name: Upgrade NPM
      #    command: 'npm install -g npm@latest && npm i -g npm-upgrade'
      - run:
          name: Install dependencies and audit them
          command: npm audit --audit-level=high
      - run:
          name: Run Tests
          command: npm test

workflows:
  version: 2
  test:
    jobs:
      - test