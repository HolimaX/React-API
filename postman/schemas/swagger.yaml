---
openapi: "3.1.0"
info:
    description: |
        Public OpenAPI contract for the React API. It documents the RESTful CRUD
        resources used by the React client and can also be used with compatible
        mocked implementations such as people.py. Protected operations expect
        an Okta-issued OAuth 2.0 access token. The API implementation is hosted
        separately from this repository.

        Terminology for integrators:
        - Cloud Dashboard (CD): the public, reusable React/API base
            used by compatible integrators.
        - Personalized Cloud Dashboard (PCD): the personalized Pro/Premium tier
            that may add authenticated user data and platform integrations.
        - Demo: a public reference deployment for browsing or integration
            checks. A demo is not a production SLA, data-retention, or security
            boundary and must not receive production or sensitive data.
        - Mock: a simulated or local-compatible implementation, such as
            people.py, used for development, tests, and contract exploration.
            Mock responses do not prove production persistence, availability, or
            Okta token validation.

        Integrators should use the OpenAPI contract for both demo and mock
        clients, but must deploy or select a production API that implements the
        documented routes, response shapes, CORS policy, and Okta validation.

        For production-ready API definitions and implementation examples, see
        the PCD v1.2.x code samples or later:
        https://github.com/Healthdash/CloudDash-Backend-ReactJS-API

        Integrator resources:
        - HealthDash homepage: https://demo.healthdash.lv
        - Support codes and integration references: https://www.healthdash.lv/SER
        - Privacy policy and terms: https://linardsliepins.wordpress.com/2019/09/18/privacy-policy/
    version: "2.0.0"
    title: React API
    contact:
        name: Repository maintainers
        url: https://github.com/HolimaX/React-API/issues
    termsOfService: https://linardsliepins.wordpress.com/2019/09/18/privacy-policy/
    license:
        name: MIT
        url: https://github.com/HolimaX/React/blob/master/LICENSE

externalDocs:
    description: Support codes and integration references
    url: https://www.healthdash.lv/SER

x-integrator-environments:
    demo:
        kind: reference-deployment
        url: https://demo.healthdash.lv
        purpose: Browse the reference Cloud Dashboard and perform non-production integration checks.
        restrictions:
            - Do not send production, personal, health, or other sensitive data.
            - Availability, data retention, and API behavior may change without notice.
    mock:
        kind: simulated-implementation
        implementation: people.py or another compatible local/mock server
        purpose: Develop and test clients against the OpenAPI contract without depending on production services.
        restrictions:
            - Mock responses are not evidence of production persistence or availability.
            - Configure authentication behavior explicitly; a mock may not validate Okta tokens.
    production:
        kind: integrator-hosted-implementation
        purpose: Serve real application traffic from an implementation that conforms to this contract.
        requirements:
            - Validate Okta access-token signature, issuer, audience, expiry, and scopes.
            - Configure HTTPS, CORS, rate limits, logging, retention, and data protection for the deployment.

#basePath: /api
servers:
    - url: "https://api.example.invalid/api/"
      description: Replace with the deployed API base URL per environment.

# Global security definition for component
security:
    - bearerAuth: []

# Paths supported by the server application
paths:
    /people:
        get:
            operationId: people.read_all
            tags:
                - people
            summary: Read the first page of people cards
            responses:
                200:
                    description: Successfully read people cards
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/read_one"
    /users:
        post:
            operationId: users.create
            tags:
                - users
            summary: Create a user account before Okta sign-in
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/create_user"
            responses:
                201:
                    description: User account created
                    content:
                        application/json:
                            schema:
                                type: object
    /health-cards:
        get:
            operationId: health_cards.read_all
            tags:
                - health-cards
            summary: Read health cards for the authenticated user
            responses:
                200:
                    description: Successfully read health cards
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    type: object
    /version/{version}:
        get:
            operationId: people.read_filter
            tags:
                - version
            summary: Read the specific filter of all versions
            description: Read the filter from versions
            parameters:
                - name: version
                  in: path
                  schema:
                      type: string
                  description: Name of version to get from version list
                  required: true
                - name: filter
                  in: query
                  schema:
                      type: string
                      enum:
                          - Latest
                          - Current
                          - Default
                      default: Latest
                  description: Filter for version presets.
                  required: false
            responses:
                200:
                    description: Successfully read version list operation
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    properties:
                                        cod:
                                            type: integer
                                        version:
                                            type: string
                                        filter:
                                            type: string
                                        flavor:
                                            type: string
    /people/{voteid}:
        get:
            security:
                - bearerAuth: []
            operationId: people.read_one
            tags:
                - people
            summary: Read one card from the card list
            description: Read one card from the card list
            parameters:
                - name: voteid
                  in: path
                  description: Leading Digits of the card to get from the list
                  schema:
                      type: string
                  required: true
            responses:
                200:
                    description: Successfully read one card from card list operation
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/read_one" # Reference to object definition
                        application/vnd.healthdashltdlatvia.healthsync.v2+json:
                            schema:
                                $ref: "#/components/schemas/read_one" # Reference to object definition
                    links:
                        PutUserByVoteId: # <---- arbitrary name for the link
                            operationId: people.update
                            # or
                            # operationRef: '#/paths/~1users~1{userId}/get'
                            parameters:
                                voteId: "$response.body#/voteid"
                            description: >
                                The `id` value returned in the response can be used as
                                the `userId` parameter in `PUT /people/{voteId}`.
                        DeleteUserByVoteId: # <---- arbitrary name for the link
                            operationId: people.delete
                            # or
                            # operationRef: '#/paths/~1users~1{userId}/get'
                            parameters:
                                voteId: "$response.body#/voteid"
                            description: >
                                The `id` value returned in the response can be used as
                                the `userId` parameter in `PUT /people/{voteId}`.
        put:
            security:
                - bearerAuth: []
            operationId: people.update
            tags:
                - people
            summary: Update or 'Link' a card in the card list
            description: |
                Update or 'Link' a card in the card list.

                If partial credit card data is present for card with provided Leading Digits, the update will 'link' question and name by adding provided data to excisting card and therefore making programmatic update.

                More details in [RnD](https://github.com/HolimaX/libgopyu/tree/master#available-ways-to-work-with-the-code-or-application)
            parameters:
                - name: voteid
                  in: path
                  description: Leading Digitis of the card to update in the list
                  schema:
                      type: string
                  required: true
            requestBody:
                description: JSON of the Person's card to update in the list
                required: true
                content:
                    application/json:
                        x-body-name: body
                        schema:
                            type: object
                            required:
                                - voteid
                            properties:
                                question:
                                    type: string
                                    description: question in updated persons card
                                name:
                                    type: string
                                    description: Owner Name in updated persons card
                                votecount:
                                    type: string
                                    description: Vote count for the question
                                voteid:
                                    type: string
                                    description: Leading Digits in updated persons card
                    application/vnd.healthdashltdlatvia.healthsync.v2+json:
                        x-body-name: body
                        schema:
                            $ref: "#/components/schemas/update_one" # Reference to object definition
                        examples: # Child of media type
                            question: # Example 1
                                value:
                                    question: jessicasmith@email.com
                                    name: My Name
                                    votecount: "1"
                            name: # Example 2
                                value:
                                    question: myname@email.com
                                    name: Jessica Smith
                                    votecount: "2"
            responses:
                200:
                    description: Successfully updated card in card list
                    links:
                        PutUserByVoteId: # <---- arbitrary name for the link
                            operationId: people.update
                            # or
                            # operationRef: '#/paths/~1users~1{userId}/get'
                            parameters:
                                voteId: "$response.body#/voteid"
                            description: >
                                The `id` value returned in the response can be used as
                                the `userId` parameter in `PUT /people/{voteId}`.
        delete:
            security:
                - bearerAuth: []
            operationId: people.delete
            tags:
                - people
            summary: Delete a card from the card list
            description: Delete a card
            parameters:
                - name: voteid
                  in: path
                  schema:
                      type: string
                      default: "0"
                  description: Leading Digits in persons card
                  required: true
            responses:
                200:
                    description: Successfully deleted a card from card list
                    links:
                        DeleteUserByVoteId: # <---- arbitrary name for the link
                            operationId: people.delete
                            # or
                            # operationRef: '#/paths/~1users~1{userId}/get'
                            parameters:
                                voteId: "$response.body#/voteid"
                            description: >
                                The `id` value returned in the response can be used as
                                the `userId` parameter in `PUT /people/{voteId}`.

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: Okta OAuth 2.0 access token. Validate issuer, audience, signature, expiry, and scopes on the server.
        oktaOidc:
            type: oauth2
            description: OIDC authorization-code flow for the browser client. Configure the issuer per environment.
            flows:
                authorizationCode:
                    authorizationUrl: "https://{oktaDomain}/oauth2/{authorizationServerId}/v1/authorize"
                    tokenUrl: "https://{oktaDomain}/oauth2/{authorizationServerId}/v1/token"
                    scopes:
                        openid: Authenticate the user
                        profile: Read basic profile claims
                        email: Read the user's email claim
                    x-token-validation:
                        issuer: "https://{oktaDomain}/oauth2/{authorizationServerId}"
                        audience: Configure to match the API authorization server
    schemas:
        read_one: # Object definition
            required:
                - voteid
            properties:
                question:
                    type: string
                    description: Question in retrieved persons card
                name:
                    type: string
                    description: Owner Name in retrieved persons card
                tagline:
                    type: string
                    description: Tag-Line in retrieved persons card
                imageurl:
                    type: string
                    description: Image URL in retrieved persons card
                votecount:
                    type: string
                    description: Vote count for the question in retrieved persons card
                voteid:
                    type: string
                    description: Leading Digits in retrieved persons card
        create_one: # Object definition
            required:
                - voteid
            properties:
                question:
                    type: string
                    description: Question in retrieved persons card
                name:
                    type: string
                    description: Owner Name in retrieved persons card
                tagline:
                    type: string
                    description: Tag-Line in retrieved persons card
                imageurl:
                    type: string
                    description: Image URL in retrieved persons card
                votecount:
                    type: string
                    description: Vote count for the question in retrieved persons card
                voteid:
                    type: string
                    description: Leading Digits in retrieved persons card
        update_one:
            required:
                - voteid
            properties:
                tagline:
                    type: string
                    description: Tag-Line of card to create
                imageurl:
                    type: string
                    description: Image URL of card to create
                votecount:
                    type: string
                    description: Vote count for the question
        create_user:
            type: object
            required:
                - email
            properties:
                firstName:
                    type: string
                lastName:
                    type: string
                email:
                    type: string
                    format: email
                password:
                    type: string
                    format: password
